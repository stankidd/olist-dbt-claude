version: 2

models:
  - name: mart_orders
    description: "Order lifecycle, delivery performance, basket size, and payment summary for delivered orders. Informs logistics SLA reviews and AOV tracking."
    columns:
      - name: order_id
        description: "Unique order identifier."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to the order's customer record."
      - name: customer_unique_id
        description: "Identifies the person across orders. Enables join to mart_customers."
        tests:
          - not_null
      - name: order_status
        description: "Always 'delivered' in this model."
        tests:
          - accepted_values:
              arguments:
                values: ['delivered']
      - name: order_purchase_timestamp
        description: "Timestamp the order was placed."
      - name: order_purchase_date
        description: "order_purchase_timestamp cast to DATE."
      - name: order_delivered_customer_date
        description: "Timestamp the order was delivered. NULL on 8 rows despite a delivered status."
      - name: order_estimated_delivery_date
        description: "Estimated delivery date shown to the customer at purchase."
      - name: delivery_days
        description: "Days from purchase to delivery."
      - name: estimated_delivery_days
        description: "Days from purchase to the estimated delivery date."
      - name: delivery_delay_days
        description: "delivery_days minus estimated_delivery_days. Positive means late."
      - name: is_on_time
        description: "True when delivered on or before the estimated date."
      - name: total_items
        description: "Count of line items on the order."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 1"
      - name: total_gmv
        description: "SUM of price + freight_value across the order's line items. BRD GMV calculation."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: avg_item_price
        description: "Average line-item price on the order."
      - name: distinct_sellers
        description: "Count of distinct sellers on the order. Flags multi-seller orders."
      - name: payment_type
        description: "Modal payment type for the order."
      - name: payment_installments
        description: "Max installment count across the order's payments."
      - name: total_payment_value
        description: "Total amount paid across all payment rows. Reconciliation check against total_gmv."
      - name: customer_state
        description: "Customer's 2-letter state code."
        tests:
          - not_null
      - name: seller_id
        description: "Seller of the order's first line item. BRD 'from first item' attribution rule."
      - name: seller_state
        description: "State of the seller attributed to the order's first line item."
        tests:
          - not_null
      - name: primary_product_category
        description: "English product category of the order's first line item."

  - name: mart_customers
    description: "Lifetime value and repeat-purchase behavior per person. Grain is customer_unique_id, not customer_id, because customer_id is issued per order (deviation 2)."
    columns:
      - name: customer_unique_id
        description: "Identifies the person across orders."
        tests:
          - unique
          - not_null
      - name: customer_state
        description: "State on the person's most recent order."
        tests:
          - not_null
      - name: customer_city
        description: "City on the person's most recent order."
      - name: first_order_date
        description: "Earliest order_purchase_timestamp across all statuses."
        tests:
          - not_null
      - name: last_order_date
        description: "Latest order_purchase_timestamp across all statuses."
        tests:
          - not_null
      - name: total_orders
        description: "Distinct orders placed, all statuses. BRD total_orders."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 1"
      - name: delivered_orders
        description: "Distinct delivered orders. Supports the valid-order rule."
      - name: total_items
        description: "Line items across delivered orders. 0 for customers with no delivered order."
      - name: total_spend
        description: "SUM(gmv) across delivered orders. BRD total_spend, valid-order rule."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: avg_order_value
        description: "total_spend divided by delivered_orders. NULL for customers with no delivered order."
      - name: is_repeat_customer
        description: "True when total_orders > 1. BRD is_repeat_customer."
        tests:
          - not_null
      - name: avg_review_score
        description: "Average score across this person's reviews. NULL if they left none."
      - name: total_reviews
        description: "Count of reviews left by this person. 0 if none."
      - name: customer_lifespan_days
        description: "Days between first and last order."
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: avg_days_between_orders
        description: "customer_lifespan_days divided by (total_orders - 1). NULL for single-order customers."

  - name: mart_sellers
    description: "Seller performance scorecard combining volume, revenue, delivery reliability, and review quality, with a tier for account management."
    columns:
      - name: seller_id
        description: "Unique seller identifier."
        tests:
          - unique
          - not_null
      - name: seller_state
        description: "Seller's 2-letter state code."
        tests:
          - not_null
      - name: seller_city
        description: "Seller city."
      - name: total_orders
        description: "Distinct orders containing this seller's items, all statuses. BRD total_orders."
        tests:
          - not_null
      - name: delivered_orders
        description: "Distinct delivered orders containing this seller's items. Supports the valid-order rule."
      - name: total_items_sold
        description: "Count of this seller's line items, all statuses. BRD total_items_sold."
        tests:
          - not_null
      - name: total_gmv
        description: "SUM of price + freight_value across this seller's items on delivered orders. BRD total_gmv, valid-order rule."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: unique_customers
        description: "Distinct customers (by customer_unique_id) this seller has sold to. BRD unique_customers."
      - name: unique_product_categories
        description: "Distinct product categories this seller has listed items in. BRD unique_product_categories."
      - name: avg_review_score
        description: "Average score across reviews on orders containing this seller's items. NULL if none."
      - name: total_reviews
        description: "Count of distinct review-order pairs touching this seller. Denominator for the pct_ metrics. 0 if none."
      - name: pct_5_star
        description: "Share of this seller's reviews scored 5. Denominator is total_reviews, not total_orders (deviation 4)."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
      - name: pct_1_star
        description: "Share of this seller's reviews scored 1. Denominator is total_reviews, not total_orders (deviation 4)."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
      - name: avg_delivery_days
        description: "Average delivery_days across this seller's distinct delivered orders."
      - name: on_time_delivery_rate
        description: "Share of this seller's distinct delivered orders (with a delivered date) that arrived on time."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
      - name: seller_tier
        description: "Gold: total_gmv >= 10,000 and avg_review_score >= 4.0. Silver: total_gmv >= 1,000 and avg_review_score >= 3.5. Bronze: everyone else. Thresholds set from profiled GMV/review percentiles (deviation 8), the BRD did not specify them."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Gold', 'Silver', 'Bronze']

  - name: mart_reviews
    description: "Review sentiment with the product and delivery context needed to explain it. Informs seller coaching and logistics escalations."
    columns:
      - name: review_order_key
        description: "Surrogate key of (review_id, order_id). Grain of this model (deviation 1)."
        tests:
          - unique
          - not_null
      - name: review_id
        description: "Review identifier. NOT unique on its own."
        tests:
          - not_null
      - name: order_id
        description: "Foreign key to the reviewed order."
        tests:
          - not_null
      - name: customer_id
        description: "Foreign key to the order's customer record."
        tests:
          - not_null
      - name: customer_unique_id
        description: "Identifies the person across orders."
      - name: customer_state
        description: "Customer's 2-letter state code."
      - name: review_score
        description: "Star rating, 1 to 5."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
      - name: sentiment_bucket
        description: "Negative for scores 1-2, Neutral for 3, Positive for 4-5."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Negative', 'Neutral', 'Positive']
      - name: has_comment
        description: "True when review_comment_message is non-blank after trimming."
        tests:
          - not_null
      - name: review_creation_date
        description: "Date the review was created."
      - name: response_time_days
        description: "Days between review creation and the seller/marketplace answer."
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: review_sequence
        description: "1-based sequence of this review within its order."
      - name: order_status
        description: "Status of the reviewed order."
      - name: product_category
        description: "English category of the order's first line item. NULL for the 775 item-less orders."
      - name: seller_id
        description: "Seller of the order's first line item. NULL for the 775 item-less orders."
      - name: seller_state
        description: "State of the seller attributed to the order's first line item."
      - name: delivery_days
        description: "Days from purchase to delivery on the reviewed order."
      - name: delivery_delay_days
        description: "Delivery delay of the reviewed order."
      - name: is_late_delivery
        description: "True when the reviewed order was delivered after its estimated date."
