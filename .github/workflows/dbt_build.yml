name: dbt build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install dbt-core dbt-duckdb duckdb kaggle

      - name: Configure Kaggle token
        run: |
          mkdir -p ~/.kaggle
          echo -n '${{ secrets.KAGGLE_API_TOKEN }}' > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token

      - name: Load data into DuckDB
        run: python scripts/load_data.py

      - name: Install dbt packages
        run: dbt deps

      - name: Run dbt build
        run: dbt build --profiles-dir .